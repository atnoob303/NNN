<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox UI Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topbar">
  <span class="logo">🎮 Roblox UI Builder <span class="version-tag" style="font-size:9px;opacity:.6;font-weight:400"></span></span>
  <div class="sep"></div>
  <button class="tbtn active" id="btn-sel" onclick="setTool('sel')">✦ Select</button>
  <button class="tbtn" id="btn-drw" onclick="setTool('drw')">✎ Draw</button>
  <div class="sep"></div>
  <button class="tbtn cy" onclick="undo()">↩ Undo</button>
  <button class="tbtn gr" onclick="dupSel()">⧉ Dup</button>
  <button class="tbtn" onclick="layerUp()">↑ Fwd</button>
  <button class="tbtn" onclick="layerDn()">↓ Bck</button>
  <div class="sep"></div>
  <div id="align-bar" style="display:none;gap:3px;align-items:center">
    <button class="tbtn" title="Align Left"      onclick="alignLeft()">⬤◁</button>
    <button class="tbtn" title="Center H"        onclick="alignCenterH()">⬤↔</button>
    <button class="tbtn" title="Align Right"     onclick="alignRight()">▷⬤</button>
    <button class="tbtn" title="Align Top"       onclick="alignTop()">⬤△</button>
    <button class="tbtn" title="Center V"        onclick="alignCenterV()">⬤↕</button>
    <button class="tbtn" title="Align Bottom"    onclick="alignBottom()">▽⬤</button>
    <button class="tbtn cy" title="Distribute H" onclick="distributeH()">⇔</button>
    <button class="tbtn cy" title="Distribute V" onclick="distributeV()">⇕</button>
  </div>
  <button class="tbtn" id="btn-ruler" onclick="toggleRuler()" title="Bật/tắt số đo">📏 Ruler</button>
  <button class="tbtn active" id="btn-distguide" onclick="toggleDistGuide()" title="Tia khoảng cách">📐 Dist</button>
  <button class="tbtn" onclick="neOpen()">⬡ Nodes</button>
<div class="sep"></div>
  <button class="tbtn rd" onclick="clearAll()">✕ Clear</button>
  <button class="tbtn yw" onclick="showExport()">⬇ Export Lua</button>
  <span id="cinfo" style="margin-left:auto;font-size:9px;color:var(--tx3);font-family:'JetBrains Mono',monospace"></span>
</div>
<div id="main">
  <div id="lp">
    <div class="lptabs">
      <div class="lptab on" id="lt0" onclick="lTab(0)">Components</div>
      <div class="lptab" id="lt1" onclick="lTab(1)">Hierarchy</div>
    </div>
    <!-- Left panel content sẽ được render động bởi app.js đọc COMPONENT_GROUPS -->
    <div class="lptc on" id="lc0">
      <div id="comp-list"></div>
    </div>
    <div class="lptc" id="lc1">
      <div id="elist"></div>
      <div id="eemp" class="el-emp">Chưa có element nào.<br>Click component để bắt đầu!</div>
    </div>
  </div>
  <div id="ca" style="position:relative">
    <div class="gridbg"></div>
    <div id="cv">
      <div id="ehint">
        <div class="ehint-ic">🎮</div>
        <div class="ehint-tx">Click component bên trái rồi kéo vẽ<br><span style="font-size:9px;color:var(--tx3)">Delete · Ctrl+Z · Ctrl+D · Arrow keys · Shift+Click để multi-select</span></div>
      </div>
    </div>
    <div id="ruler-overlay" style="display:none;position:absolute;inset:0;pointer-events:none;z-index:500"></div>
  </div>
  <div id="rp"><div id="pp"><div class="no-sel">Chọn một element<br>để xem Properties</div></div></div>
</div>

<!-- Export Modal -->
<div id="em">
  <div id="eb">
    <div class="em-hdr"><span class="em-title">📄 Export Code</span><button class="em-x" onclick="hideExport()">✕</button></div>
    <div class="em-tabs">
      <div class="em-tab on" id="etl" onclick="setExTab('lua')">Lua (Roblox)</div>
      <div class="em-tab" id="eth" onclick="setExTab('html')">HTML Preview</div>
    </div>
    <pre id="ec"></pre>
    <div class="em-ftr">
      <span class="em-info" id="einfo"></span>
      <button class="tbtn" onclick="copyCode()">📋 Copy</button>
      <button class="tbtn gr" onclick="dlCode()">⬇ Download</button>
      <button class="tbtn" onclick="hideExport()">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!--
  ═══════════════════════════════════════════════
  LOAD ORDER — QUAN TRỌNG, không được đổi thứ tự
  ═══════════════════════════════════════════════
  1. definitions.js  — DEFS, MDEF, COL, FONTS, mkEl, COMPONENT_GROUPS
  2. effects.js      — FX animations (không có dependencies ngoài DOM)
  3. modifiers.js    — renderElExtra, renderPropsExtra, renderModExtra
  4. codegen.js      — buildLua, buildHTML, showExport (cần els, getEl từ app.js)
  5. app.js          — Core logic (gọi các file trên)
-->
<script src="definitions.js"></script>
<script src="effects.js"></script>
<script src="modifiers.js"></script>
<script src="codegen.js"></script>
<script src="app.js"></script>
<script src="node_editor.js"></script>
</body>
</html>
